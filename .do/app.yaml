# App Platform specification for the frontend Static Site.
# Production deployment is controlled by the GitHub Actions workflow.
name: portal-proveedores-frontend
# App Platform uses the NYC region slug; NYC3 is a datacenter slug.
region: nyc

static_sites:
  - name: frontend
    github:
      repo: wyndercast/portal-proveedores-frontend
      branch: master
      deploy_on_push: false
    build_command: npm ci && npm run build -- --configuration production
    output_dir: dist/frontend/browser
    catchall_document: index.html
